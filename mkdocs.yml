site_name: "Privacy Skill Vault"
site_url: "https://privacyskillvault.com/"
site_description: "Defensive Operations, Threat Analysis & Security Testing"
site_author: "Privacy Skill Vault"

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/branding/PSV-colored.png
  favicon: assets/branding/favicon.ico
  palette:
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: "Switch to light mode"
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.view

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - "Home": "index.md"
  - "Learn": "learn/index.md"
  - "Labs": "labs/index.md"
  - "Investigations": "investigations/index.md"
  - "Tools": "tools/index.md"
  - "Blog": "blog/index.md"
