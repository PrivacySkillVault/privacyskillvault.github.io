site_name: "Privacy Skill Vault"
site_url: "https://privacyskillvault.com/"
site_description: "Practical cybersecurity operations, fraud investigation, detection engineering, security labs, and standards-based technical references."
site_author: "Saju Varghese"
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/branding/PSV-colored.png
  favicon: assets/branding/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: blue
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: blue
      toggle:
        icon: material/brightness-4
        name: "Switch to light mode"
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.view
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/psv-navigation.js
  - javascripts/tools.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
nav:
  - Home: index.md
  - About: about.md
  - Standards & Frameworks: standards/index.md
  - Learn:
      - Overview: learn/index.md
      - D01 - Infrastructure & Platform Foundation: learn/d01/index.md
      - D02 - Security Monitoring & Detection: learn/d02/index.md
      - D03 - Offensive Security & Testing: learn/d03/index.md
      - D04 - Security Operations & Investigations: learn/d04/index.md
      - D05 - Operations, Maintenance & Capstone: learn/d05/index.md
  - Labs:
      - Overview: labs/index.md
      - Windows Endpoint Telemetry Lab: labs/windows-endpoint-telemetry.md
  - Investigations:
      - Overview: investigations/index.md
      - Scheduled Task & PowerShell Investigation: investigations/scheduled-task-powershell.md
  - Detection Engineering:
      - Overview: detection-engineering/index.md
      - PowerShell Encoded Command: detection-engineering/windows-powershell-encoded-command.md
      - Local Administrators Group Change: detection-engineering/windows-local-admin-membership.md
  - Operational Templates: templates/index.md
  - Tools: tools/index.md
  - Blog: blog/index.md
