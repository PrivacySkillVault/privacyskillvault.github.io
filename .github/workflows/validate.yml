name: Validate PSV

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install MkDocs Material
        run: python -m pip install --upgrade pip mkdocs-material
      - name: Validate Sigma rules against Sigma 2.1.0 schema
        uses: SigmaHQ/sigma-rules-validator@aa3561cf4c5b577330ce4ace97d363853624b29a # v1
        with:
          paths: |
            ./docs/detection-engineering/rules
          schemaURL: https://raw.githubusercontent.com/SigmaHQ/sigma-specification/refs/tags/v2.1.0/json-schema/sigma-detection-rule-schema.json
      - name: Install Sigma CLI and conversion plugins
        run: |
          python -m pip install 'sigma-cli==3.1.0'
          sigma plugin install splunk
          sigma plugin install sysmon
      - name: Convert Sigma rules to Splunk SPL
        run: |
          sigma list pipelines splunk
          sigma convert -t splunk -p sysmon docs/detection-engineering/rules/windows-powershell-encoded-command.yml
      - name: Check JavaScript syntax
        run: node --check docs/javascripts/tools.js
      - name: Build site strictly
        run: mkdocs build --strict
